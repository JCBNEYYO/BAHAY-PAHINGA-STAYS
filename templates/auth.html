{% extends "base.html" %}{% block content %}
<h1>{{ 'Create account' if mode == 'register' else 'Login' }}</h1>
<form method="post" class="card" style="max-width:380px">
{% if mode == 'register' %}<label>Name<input name="name" required></label>{% endif %}
<label>Email<input type="email" name="email" required></label>
<label>Password<input type="password" name="password" required minlength="6"></label>
<button class="btn">{{ 'Register' if mode == 'register' else 'Login' }}</button></form>
{% endblock %}
